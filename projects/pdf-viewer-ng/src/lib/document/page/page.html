<div class="canvas-host" #canvasHost></div>
@if (near() && page(); as page) {
  <pdfv-text-layer
    [page]="page"
    [scale]="scale()"
    [matches]="matches()"
    [selectedMatch]="selectedMatch()"
  />
  <pdfv-link-layer [page]="page" />
  <pdfv-annotation-layer [page]="page" [scale]="scale()" />
}
@if (renderFailed()) {
  <p class="error">{{ errorText }}</p>
}
