<button
  type="button"
  class="button"
  pdfvToolbarItem
  [disabled]="!store.canZoomOut()"
  [attr.aria-label]="messages.zoomOut"
  (click)="store.zoomOut()"
>
  <pdfv-icon name="zoom-out" />
</button>
<select
  class="zoom-select"
  pdfvToolbarItem
  [disabled]="!store.hasDocument()"
  [attr.aria-label]="messages.zoomLevel"
  (change)="onSelect($event)"
>
  @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === selected()">
      {{ option.label }}
    </option>
  }
</select>
<button
  type="button"
  class="button"
  pdfvToolbarItem
  [disabled]="!store.canZoomIn()"
  [attr.aria-label]="messages.zoomIn"
  (click)="store.zoomIn()"
>
  <pdfv-icon name="zoom-in" />
</button>
