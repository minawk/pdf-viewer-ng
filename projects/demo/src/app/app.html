<header class="header">
  <h1 class="title">pdf-viewer-ng</h1>
  <label class="field">
    <span>Theme</span>
    <select [value]="theme()" (change)="onThemeChange($event)">
      @for (option of themes; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>
</header>

<main class="main">
  <pdfv-viewer [theme]="theme()" />
</main>
