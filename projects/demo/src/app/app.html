<header class="header">
  <h1 class="title">pdf-viewer-ng</h1>
  <div class="controls">
    <div class="field">
      <label for="document-select">Document</label>
      <select id="document-select" [value]="src()" (change)="onDocumentChange($event)">
        @for (option of documents; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="theme-select">Theme</label>
      <select id="theme-select" [value]="theme()" (change)="onThemeChange($event)">
        @for (option of themes; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="page-mode-select">Page mode</label>
      <select id="page-mode-select" [value]="pageMode()" (change)="onPageModeChange($event)">
        @for (option of pageModes; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <button type="button" class="action" (click)="page.set(5)">Go to page 5</button>
    <output class="event" aria-label="Viewer state">page {{ page() }} · {{ lastEvent() }}</output>
  </div>
</header>

<main class="main">
  <pdfv-viewer
    [src]="src()"
    [theme]="theme()"
    [pageMode]="pageMode()"
    [(page)]="page"
    (loaded)="onLoaded($event)"
    (loadError)="onLoadError($event)"
  />
</main>
