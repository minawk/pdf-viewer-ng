<header class="header">
  <div class="intro">
    <div class="brand">
      <h1 class="title">pdf-viewer-ng</h1>
      <p class="tagline">
        Accessible, signal-based PDF viewer for Angular. Install:
        <code class="install">ng add &#64;minawk/pdf-viewer-ng</code>
      </p>
    </div>
    <nav class="links" aria-label="Project">
      <a href="https://github.com/minawk/pdf-viewer-ng">GitHub</a>
      <a href="https://github.com/minawk/pdf-viewer-ng/tree/main/projects/pdf-viewer-ng#readme"
        >Documentation</a
      >
      <a href="https://www.npmjs.com/package/@minawk/pdf-viewer-ng">npm</a>
    </nav>
  </div>
  <div class="controls" role="group" aria-label="Demo settings">
    <div class="field">
      <label for="document-select">Document</label>
      <select id="document-select" [value]="src()" (change)="onDocumentChange($event)">
        @for (option of documents; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="theme-select">Theme</label>
      <select id="theme-select" [value]="theme()" (change)="onThemeChange($event)">
        @for (option of themes; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="page-mode-select">Page mode</label>
      <select id="page-mode-select" [value]="pageMode()" (change)="onPageModeChange($event)">
        @for (option of pageModes; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
    <button type="button" class="action" (click)="page.set(5)">Go to page 5</button>
    <output class="event" aria-label="Viewer state"
      >page {{ page() }} · zoom {{ zoomLabel() }} · annotations {{ annotations()?.length ?? 0 }} ·
      {{ lastEvent() }}</output
    >
  </div>
</header>

<main class="main">
  <pdfv-viewer
    [src]="src()"
    [theme]="theme()"
    [pageMode]="pageMode()"
    [(page)]="page"
    [(zoom)]="zoom"
    [(annotations)]="annotations"
    (loaded)="onLoaded($event)"
    (loadError)="onLoadError($event)"
    (fileOpened)="onFileOpened($event)"
    (downloaded)="onDownloaded($event)"
  />
</main>
